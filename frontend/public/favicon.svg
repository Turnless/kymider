<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kymider">
  <!-- Espresso tile so the mark holds its own on a light or a dark tab strip. -->
  <rect width="64" height="64" rx="14" fill="#1b1410"/>
  <!-- The seal: an open ring around a solid centre — the proof is visible,
       the value inside it is not. Same mark as the nav wordmark's glyph. -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#d46d25" stroke-width="5"/>
  <circle cx="32" cy="32" r="7.5" fill="#d46d25"/>
</svg>
