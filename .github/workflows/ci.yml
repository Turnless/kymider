name: CI

# Kymider runs its full vertical slice here rather than on a developer machine:
# the `compact` compiler is a Linux-only binary and the devnet (Midnight node +
# indexer + proof server) needs Docker, so Linux runners are the only place the
# whole thing goes green in one pass.
#
# Layout:
#   contracts  -> compile the Compact programs, cache + publish compiled/
#   unit       -> typecheck + unit and offline contract tests (no Docker)
#   simulation -> docker compose devnet + the two-wallet ZK simulation, then
#                 prove:onchain + verify:onchain (artifact `proof-local`)

on:
  push:
    # Every branch, not just main: the compiler is Linux-only, so CI is the only
    # place contract work can be checked at all, and dispatching runs by hand
    # for each attempt is slower than the runners are.
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  # Toolchain 0.31.1 is the last release on the Compact 0.23 language line,
  # which is what `pragma language_version 0.23` in contracts/ requires.
  COMPACT_TOOLCHAIN: '0.31.1'
  NODE_VERSION: '22'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Compile contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Needed by "Sync the tracked contract modules" below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The compiled artifacts are deterministic for a given source + toolchain,
      # and ZK key generation is the slowest step in the pipeline, so cache them.
      - name: Restore compiled contracts
        id: cache
        uses: actions/cache@v4
        with:
          path: compiled
          key: compact-${{ env.COMPACT_TOOLCHAIN }}-${{ hashFiles('contracts/**/*.compact') }}

      - name: Install the Compact toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # The installer (cargo-dist) picks the first of $XDG_BIN_HOME,
          # $XDG_DATA_HOME/../bin, $HOME/.local/bin. Pin the first so the
          # install location is deterministic instead of runner-dependent, and
          # because it only wires up PATH for interactive shells.
          export XDG_BIN_HOME="$HOME/.local/bin"
          mkdir -p "$XDG_BIN_HOME"

          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh

          if [ ! -x "$XDG_BIN_HOME/compact" ]; then
            echo "::error::compact was not installed to $XDG_BIN_HOME"
            find "$HOME" -maxdepth 5 -name compact -type f 2>/dev/null || true
            exit 1
          fi
          echo "$XDG_BIN_HOME" >> "$GITHUB_PATH"

      - name: Pin the toolchain to the 0.23 language line
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          compact update "$COMPACT_TOOLCHAIN"
          compact --version

      - name: Compile
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm run build:contracts

      - name: Check the artifacts look complete
        run: |
          set -euo pipefail
          for d in compiled/solvency-proof compiled/registry compiled/loan compiled/loan-directory; do
            test -f "$d/contract/index.js"  || { echo "::error::missing $d/contract/index.js"; exit 1; }
            test -d "$d/keys"              || { echo "::error::missing $d/keys"; exit 1; }
          done
          echo "Compiled artifacts:"
          du -sh compiled/*

      # The contract modules are tracked, because a fresh clone has to be
      # able to build the web console and run the offline contract tests, and
      # the compiler is a Linux-only binary that most contributors cannot run.
      # That makes this the only place they can be regenerated — so when a
      # .compact source changes, push the rebuilt modules back rather than
      # leaving the repository describing contracts it no longer has. The ZK
      # keys stay untracked; only the contract/ directories move.
      - name: Sync the tracked contract modules
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          paths="compiled/registry/contract compiled/solvency-proof/contract compiled/loan/contract compiled/loan-directory/contract"
          # status, not diff: a newly added contract has no tracked module yet,
          # and `git diff` does not see untracked files.
          if [ -z "$(git status --porcelain -- $paths)" ]; then
            echo "Tracked contract modules already match the sources."
            exit 0
          fi
          echo "Contract modules changed; syncing them back to ${GITHUB_REF_NAME}."
          git status --short -- $paths
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $paths
          git commit -m "CI: sync compiled contract modules to the .compact sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: compiled-contracts
          path: compiled
          retention-days: 7

  unit:
    name: Typecheck + unit tests
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/download-artifact@v4
        with:
          name: compiled-contracts
          path: compiled

      - run: npm ci

      # contracts/index.ts imports from compiled/, so this only passes once the
      # artifacts are in place.
      - run: npm run typecheck

      # Circuit math plus the compiled contracts driven offline through
      # tests/unit/support/simulators.ts - no Docker, no proof server.
      - run: npm run test:unit

  console:
    name: Build the web console
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The console imports the compiled contract modules directly and runs
      # them in the browser, so a contract change can break the build. Nothing
      # caught that before this job existed.
      - uses: actions/download-artifact@v4
        with:
          name: compiled-contracts
          path: compiled

      - run: npm ci
        working-directory: frontend

      # tsc -b then vite build; the wasm runtime has to bundle too.
      - run: npm run build
        working-directory: frontend

  # Publish the console so it can be opened rather than installed. It is a
  # static bundle that runs the contracts client-side, so there is nothing to
  # host but files.
  pages:
    name: Publish the console
    needs: contracts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: compiled-contracts
          path: compiled

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
        env:
          # A project site lives under /<repo>/, not at the domain root.
          PAGES_BASE: /${{ github.event.repository.name }}/

      # Pages has no rewrite rules, so a deep link like /app/facts would 404
      # before the app ever loads. Serving index.html as the 404 page hands the
      # URL to the router instead.
      - run: cp frontend/dist/index.html frontend/dist/404.html

      # One-time manual step: Settings -> Pages -> Source: "GitHub Actions".
      # `enablement: true` cannot substitute for it — the default Actions token
      # is not allowed to CREATE a Pages site ("Resource not accessible by
      # integration"), only to deploy to one that already exists.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deploy
        uses: actions/deploy-pages@v4

  simulation:
    name: Devnet simulation
    needs: contracts
    runs-on: ubuntu-latest
    # The simulations plus prove:onchain, which submits about 30 more proven
    # transactions.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/download-artifact@v4
        with:
          name: compiled-contracts
          path: compiled

      - run: npm ci

      # Healthchecks in docker-compose.yml gate this: the node must have
      # produced block 1 before the indexer is allowed to start.
      - name: Start the local devnet
        run: docker compose up -d --wait

      - name: Report service state
        run: docker compose ps

      # Proof generation burns DUST, which accrues from staked NIGHT, so the
      # wallet has to be funded before the simulation can prove anything.
      - name: Wait for NIGHT + DUST
        run: npm run wait:dust

      - name: Run the devnet simulations (Wave 1, Wave 2)
        run: npm run test:simulation

      # The whole story again as one recorded run: fresh contracts, the Wave 1
      # claim flow, loans at 110% and 150% to REPAID, and the two-loan history
      # proof. Writes PROOF.md and frontend/public/deployments/local.json from
      # the receipts. These are devnet hashes: they go in the artifact below,
      # never in a commit (the public record comes from preprod.yml).
      - name: Prove on the devnet (every transaction recorded)
        # Clear any committed record first, so the artifact below can only
        # ever hold what this run wrote.
        run: |
          rm -f PROOF.md frontend/public/deployments/local.json
          npm run prove:onchain
        env:
          MIDNIGHT_NETWORK: local

      # Independent, read-only re-check from the indexer: every claim in
      # PROOF.md and every transaction hash.
      - name: Verify the record against the devnet
        run: npm run verify:onchain
        env:
          MIDNIGHT_NETWORK: local

      - name: Upload the devnet proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-local
          path: |
            PROOF.md
            frontend/public/deployments/local.json
          if-no-files-found: warn
          retention-days: 14

      - name: Devnet logs
        if: failure()
        run: docker compose logs --no-color --tail 400

      - name: Tear down
        if: always()
        run: docker compose down -v

  # The console end to end in a real browser: the judge fast path, the
  # contract's refusals, the Wave 1 flow and a smoke pass over every route, at
  # desktop and phone widths (frontend/e2e/, frontend/playwright.config.ts).
  e2e:
    name: Console end-to-end
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: compiled-contracts
          path: compiled

      - run: npm ci
        working-directory: frontend

      # The Chromium build matching the pinned @playwright/test, plus its
      # system libraries. Runners have no preinstalled Playwright browsers.
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      # Builds the console and serves it with `vite preview` (webServer in
      # playwright.config.ts), then runs the desktop and phone projects.
      - run: npm run e2e
        working-directory: frontend
        env:
          CI: 'true'

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e/.report
            frontend/e2e/.results
          retention-days: 7
