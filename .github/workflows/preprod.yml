name: Preprod proof

# Runs Kymider end to end on Midnight Preprod and commits the public record:
#
#   PROOF.md                                   every transaction: step, contract,
#                                              circuit, tx hash, block; what each
#                                              proves and what stays private
#   frontend/public/deployments/preprod.json   the same record for the console
#
# Manual only (Actions -> Preprod proof -> Run workflow): it spends the funded
# Preprod wallet's DUST and takes a while (wallet sync, then ~30 proven
# transactions). It needs two secrets, created by the owner:
#
#   PREPROD_WALLET_SEED   hex seed or mnemonic of a wallet funded with tNIGHT
#                         (faucet: https://midnight-tmnight-preprod.nethermind.dev/)
#   BLOCKFROST_PROJECT_ID a Blockfrost project ID for Midnight Preprod (starts
#                         with "nightpreprod"). Midnight's own Preprod indexer and
#                         RPC were shut down on 2026-10-09; Blockfrost serves them.
#                         The ID never reaches PROOF.md or the deployments file.
#
# No wallet app is needed: `npm run wallet:new` (on your own machine) prints
# fresh recovery words and the address this run derives from them. The run
# registers the tNIGHT for DUST itself; an unfunded wallet stops at once with
# its address in the log.
#
# One wallet plays both roles; the borrower and the lenders keep separate dapp
# keys, which is the identity the circuits check (scripts/lib/wallets.ts).

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit PROOF.md and the deployments file back to this branch'
        type: boolean
        default: true
      explorer_tx_url:
        description: 'Optional explorer URL pattern for tx links, with {txHash}. Leave empty unless confirmed.'
        type: string
        default: ''

env:
  # Same toolchain as ci.yml (Compact language 0.23).
  COMPACT_TOOLCHAIN: '0.31.1'
  NODE_VERSION: '22'

# One run at a time: runs share the wallet, and two would race for its coins.
concurrency:
  group: preprod-proof
  cancel-in-progress: false

jobs:
  prove:
    name: Prove on Preprod
    runs-on: ubuntu-latest
    # A fresh wallet can take a long time to sync on a public network; the
    # script allows hours per sync step, so give the job nearly the maximum.
    timeout-minutes: 330
    permissions:
      contents: write
    env:
      MIDNIGHT_NETWORK: preprod
    steps:
      - name: Check the secrets
        env:
          PREPROD_WALLET_SEED: ${{ secrets.PREPROD_WALLET_SEED }}
          BLOCKFROST_PROJECT_ID: ${{ secrets.BLOCKFROST_PROJECT_ID }}
        run: |
          if [ -z "${PREPROD_WALLET_SEED}" ]; then
            echo "::error title=PREPROD_WALLET_SEED is missing::Add the PREPROD_WALLET_SEED secret: Settings → Secrets → Actions"
            exit 1
          fi
          if [ -z "${BLOCKFROST_PROJECT_ID}" ]; then
            echo "::error title=BLOCKFROST_PROJECT_ID is missing::Midnight Preprod is served by Blockfrost since 2026-10-09. Create a free Preprod project at https://blockfrost.io and add its project ID as the BLOCKFROST_PROJECT_ID secret: Settings → Secrets → Actions"
            exit 1
          fi
          case "${BLOCKFROST_PROJECT_ID}" in
            nightpreprod*) ;;
            *) echo "::error title=BLOCKFROST_PROJECT_ID is not a Preprod project::Its ID should start with nightpreprod (a Mainnet ID starts with nightmainnet and is rejected on Preprod)"; exit 1 ;;
          esac
          echo "PREPROD_WALLET_SEED and BLOCKFROST_PROJECT_ID are set."
      - name: Reach Blockfrost's Preprod indexer and node
        env:
          BLOCKFROST_PROJECT_ID: ${{ secrets.BLOCKFROST_PROJECT_ID }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/idx -w '%{http_code}' -m 30 -H 'content-type: application/json' \
            -d '{"query":"{ block { height } }"}' \
            "https://midnight-preprod.blockfrost.io/api/v0?project_id=${BLOCKFROST_PROJECT_ID}")
          echo "Indexer HTTP ${code}: $(head -c 200 /tmp/idx)"
          [ "${code}" = "200" ] || { echo "::error::Blockfrost's Preprod indexer did not answer 200; check the project ID"; exit 1; }
          curl -s -m 30 -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"system_version","params":[]}' \
            "https://rpc.midnight-preprod.blockfrost.io?project_id=${BLOCKFROST_PROJECT_ID}" | head -c 200; echo

      - uses: actions/checkout@v4
        with:
          # Full history, so the record can be rebased onto a branch that
          # moved while this ran.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # The same steps and cache key as ci.yml's contracts job, so a run on a
      # branch CI has built reuses its compiled contracts and ZK keys.
      - name: Restore compiled contracts
        id: cache
        uses: actions/cache@v4
        with:
          path: compiled
          key: compact-${{ env.COMPACT_TOOLCHAIN }}-${{ hashFiles('contracts/**/*.compact') }}

      - name: Install the Compact toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export XDG_BIN_HOME="$HOME/.local/bin"
          mkdir -p "$XDG_BIN_HOME"
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          if [ ! -x "$XDG_BIN_HOME/compact" ]; then
            echo "::error::compact was not installed to $XDG_BIN_HOME"
            exit 1
          fi
          echo "$XDG_BIN_HOME" >> "$GITHUB_PATH"

      - name: Pin the toolchain to the 0.23 language line
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          compact update "$COMPACT_TOOLCHAIN"
          compact --version

      - name: Compile
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm run build:contracts

      - name: Check the artifacts look complete
        run: |
          set -euo pipefail
          for d in compiled/solvency-proof compiled/registry compiled/loan compiled/loan-directory; do
            test -f "$d/contract/index.js"  || { echo "::error::missing $d/contract/index.js"; exit 1; }
            test -d "$d/keys"              || { echo "::error::missing $d/keys"; exit 1; }
          done

      - run: npm ci

      # Proofs are generated locally, against the public network's state.
      # Same image and command as docker-compose.yml; only this service starts.
      - name: Start the proof server
        run: docker compose up -d --wait proof-server

      - name: Prove on Preprod (every transaction recorded)
        env:
          PREPROD_WALLET_SEED: ${{ secrets.PREPROD_WALLET_SEED }}
          BLOCKFROST_PROJECT_ID: ${{ secrets.BLOCKFROST_PROJECT_ID }}
          KYMIDER_EXPLORER_TX_URL: ${{ inputs.explorer_tx_url }}
          # Public-network pacing: hours for wallet sync, an hour for DUST.
          MIDNIGHT_SYNC_TIMEOUT_MS: '10800000'
          KYMIDER_DUST_TIMEOUT_MS: '3600000'
        # Clear the committed record first, so a failed run can never upload
        # or commit the previous one as its own.
        run: |
          rm -f PROOF.md frontend/public/deployments/preprod.json
          npm run prove:onchain

      # Read-only, from the public indexer: no wallet. Blockfrost needs the
      # project ID even to read.
      - name: Verify the record against Preprod
        env:
          BLOCKFROST_PROJECT_ID: ${{ secrets.BLOCKFROST_PROJECT_ID }}
        run: npm run verify:onchain

      - name: Commit the record to ${{ github.ref_name }}
        if: inputs.commit
        run: |
          set -euo pipefail
          files="PROOF.md frontend/public/deployments/preprod.json"
          # Belt and braces: the record must never carry the Blockfrost ID.
          if grep -l 'project_id' $files; then
            echo "::error::a project_id reached the record; not committing it"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $files
          if git diff --cached --quiet; then
            echo "Record unchanged."
            exit 0
          fi
          git commit -m "Preprod: on-chain proof from workflow run ${GITHUB_RUN_ID}"
          # The branch may have moved during a long run. Only these two files
          # are ours, so a rebase onto the new tip is conflict-free; autostash
          # covers anything else the build touched.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep 10
          done
          echo "::error::Could not push the record to ${GITHUB_REF_NAME}; it is in the proof-preprod artifact."
          exit 1

      - name: Upload the Preprod proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-preprod
          path: |
            PROOF.md
            frontend/public/deployments/preprod.json
          if-no-files-found: warn
          retention-days: 90

      - name: Proof server logs
        if: failure()
        run: docker compose logs --no-color --tail 200 proof-server

      - name: Tear down
        if: always()
        run: docker compose down -v
